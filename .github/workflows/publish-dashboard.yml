name: dashboard-pages

on:
  push:
    branches:
      - main
    paths:
      - docs/.nojekyll
      - docs/dashboard.json
      - docs/index.html

permissions:
  contents: read

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify dashboard-only commit
        run: |
          python - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD^", "HEAD"]
          ).decode().splitlines())
          allowed = {
              "docs/.nojekyll",
              "docs/dashboard.json",
              "docs/index.html",
          }
          if not changed or not changed.issubset(allowed):
              raise SystemExit("Dashboard commit contains unexpected files: " + repr(changed))
          PY

      - name: Validate dashboard-only snapshot
        run: python tools/validate_dashboard_feed.py --docs docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
