name: dashboard-pages

on:
  push:
    branches:
      - dashboard-feed

permissions:
  contents: read

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dashboard-feed
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify dashboard-only branch contents
        run: |
          python - <<'PY'
          import subprocess

          tracked = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"))
          tracked.discard("")
          allowed = {
              ".github/workflows/publish-dashboard.yml",
              "docs/.nojekyll",
              "docs/dashboard.json",
              "docs/index.html",
              "tools/validate_dashboard_feed.py",
          }
          if tracked != allowed:
              raise SystemExit("Dashboard feed branch contains unexpected files")
          PY

      - name: Validate dashboard-only snapshot
        run: python tools/validate_dashboard_feed.py --docs docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
